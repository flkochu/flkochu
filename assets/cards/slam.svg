.dw .bal{font-family:AU,Arial,sans-serif;font-size:10.5px;fill:var(--ink)}
.hp{stroke:var(--ink-2);stroke-width:1}

.bg{fill:#151B1F;stroke:#3B474D;stroke-width:1.5}
.corner{fill:none;stroke:#8EA5FF;stroke-width:2}
.pid{font-family:AU,Arial,sans-serif;font-size:15px;fill:#DCE4E0;letter-spacing:.08em}
.st{font-family:AS,Arial,sans-serif;font-size:15px;fill:#98A5AB}
.tt{font-family:AD,Arial,sans-serif;font-size:28px;fill:#DCE4E0}
.sb{font-family:AS,Arial,sans-serif;font-size:17px;fill:#8EA5FF}
.sep{stroke:#3B474D;stroke-width:1}
.chip{fill:none;stroke:#3B474D;stroke-width:1}
.chipt{font-family:AS,Arial,sans-serif;font-size:14px;fill:#DCE4E0;letter-spacing:.03em}
.open{font-family:AU,Arial,sans-serif;font-size:16px;fill:#8EA5FF;letter-spacing:.06em}
.cursor{fill:#8EA5FF;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
