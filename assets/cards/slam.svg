<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="SLAM 2D con ROS 2. RPLIDAR C1, slam_toolbox y odometría mecanum en micro-ROS"><title>SLAM 2D con ROS 2. RPLIDAR C1, slam_toolbox y odometría mecanum en micro-ROS</title><style>@font-face{font-family:AD;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:AU;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:AS;src:url(data:font/woff2;base64,) format('woff2')}
svg{--sheet:#151B1F;--ink:#DCE4E0;--ink-2:#98A5AB;--blue:#8EA5FF;--wash:rgba(142,165,255,.10);--rule-2:#232C31}
.dw .k{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.dw .t{fill:none;stroke:var(--ink-2);stroke-width:1;vector-effect:non-scaling-stroke}
