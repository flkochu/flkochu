<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" role="img" aria-label="Proyectos destacados"><title>Proyectos destacados</title><style>@font-face{font-family:AD;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:AS;src:url(data:font/woff2;base64,) format('woff2')}
svg{--sheet:#151B1F;--ink:#DCE4E0;--ink-2:#98A5AB;--blue:#8EA5FF;--wash:rgba(142,165,255,.10);--rule-2:#232C31}
.dw .k{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.dw .t{fill:none;stroke:var(--ink-2);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .c{fill:none;stroke:var(--blue);stroke-width:1;stroke-dasharray:12 3 2 3;vector-effect:non-scaling-stroke}
.dw .d{fill:none;stroke:var(--blue);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .dash{stroke-dasharray:5 4}
.dw .f{fill:var(--ink)} .dw .fb{fill:var(--blue)} .dw .pw{fill:var(--sheet)}
.dw .w{fill:var(--wash);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .hf{fill:url(#hatch);stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.dw .hs{fill:url(#hatch)} .dw .bar{fill:var(--rule-2)}
.dw .lo{stroke:var(--ink);stroke-linecap:round;vector-effect:non-scaling-stroke;fill:none}
.dw .li{stroke:var(--sheet);stroke-linecap:round;vector-effect:non-scaling-stroke;fill:none}
.dw .jt{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.dw text{font-family:AS,Arial,sans-serif;font-size:11px;fill:var(--ink-2)}
.dw .lbl{fill:var(--blue);font-family:AU,Arial,sans-serif;font-size:12px}
.dw .cap{fill:var(--ink);font-family:AU,Arial,sans-serif;font-size:13px}
.dw .tiny{font-size:9px}
.dw .stamp{fill:var(--blue);font-family:AD,Arial,sans-serif;font-size:13px;letter-spacing:.06em}
.dw .bal{font-family:AU,Arial,sans-serif;font-size:10.5px;fill:var(--ink)}
.hp{stroke:var(--ink-2);stroke-width:1}

.chev{fill:none;stroke:#8EA5FF;stroke-width:3.5;stroke-linecap:square}
.h{font-family:AD,Arial,sans-serif;font-size:30px;fill:#DCE4E0;letter-spacing:.16em}
.ul{fill:#8EA5FF}
.r{font-family:AS,Arial,sans-serif;font-size:14px;fill:#98A5AB;letter-spacing:.12em}
.rl{stroke:#3B474D;stroke-width:1}
</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hp" x1="0" y1="0" x2="0" y2="6"/></pattern></defs><path class="chev" d="M8 16 L22 32 L8 48"/><text class="h" x="40" y="44">PROYECTOS DESTACADOS</text><rect class="ul" x="40" y="60" width="140" height="3"/><text class="r" x="1192" y="44" text-anchor="end">PLANOS: 6 DE 12</text><line class="rl" x1="40" y1="74" x2="1192" y2="74"/></svg>